<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2820"/>
      <stop offset="100%" stop-color="#35613B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#colBg)"/>
  <g transform="translate(180, 50)">
    <!-- Prateleira de Colecionáveis e Miniaturas -->
    <rect x="20" y="220" width="400" height="15" rx="4" fill="#1BC736"/>
    <!-- Caixa de miniatura 1 -->
    <rect x="50" y="90" width="90" height="130" rx="8" fill="#e67e22" stroke="#ffffff" stroke-width="3"/>
    <circle cx="95" cy="140" r="25" fill="#ffffff" fill-opacity="0.3"/>
    <text x="95" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">MINIATURA</text>

    <!-- Álbum de Figurinhas 2 -->
    <rect x="165" y="60" width="110" height="160" rx="8" fill="#9b59b6" stroke="#ffffff" stroke-width="3"/>
    <polygon points="220,90 235,130 205,130" fill="#f1c40f"/>
    <text x="220" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ÁLBUM</text>
    <text x="220" y="180" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">FIGURINHAS</text>

    <!-- Gibi Clássico 3 -->
    <rect x="300" y="80" width="100" height="140" rx="8" fill="#e74c3c" stroke="#ffffff" stroke-width="3"/>
    <circle cx="350" cy="130" r="22" fill="#f1c40f"/>
    <text x="350" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">GIBI</text>
  </g>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    Espaço Geek, Gibis Raros e Colecionáveis
  </text>
  <text x="400" y="415" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#1BC736" text-anchor="middle">
    Álbuns de figurinhas, miniaturas em escala, mangás e quadrinhos
  </text>
</svg>
