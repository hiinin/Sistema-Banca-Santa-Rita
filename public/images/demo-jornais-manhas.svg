<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="jornalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263328"/>
      <stop offset="100%" stop-color="#1e2820"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#jornalBg)"/>
  <g transform="translate(180, 50)">
    <!-- Jornal Aberto Dobrado -->
    <rect x="50" y="40" width="340" height="230" rx="4" fill="#f8faf8" stroke="#1BC736" stroke-width="3"/>
    <!-- Manchete -->
    <rect x="75" y="65" width="290" height="20" rx="3" fill="#263328"/>
    <!-- Submanchete e colunas -->
    <rect x="75" y="95" width="135" height="100" rx="3" fill="#35613B" fill-opacity="0.15"/>
    <line x1="85" y1="110" x2="195" y2="110" stroke="#263328" stroke-width="3"/>
    <line x1="85" y1="125" x2="195" y2="125" stroke="#263328" stroke-width="2"/>
    <line x1="85" y1="140" x2="195" y2="140" stroke="#263328" stroke-width="2"/>
    <line x1="85" y1="155" x2="175" y2="155" stroke="#263328" stroke-width="2"/>
    <line x1="85" y1="170" x2="190" y2="170" stroke="#263328" stroke-width="2"/>

    <rect x="225" y="95" width="140" height="100" rx="3" fill="#1BC736" fill-opacity="0.15"/>
    <circle cx="295" cy="140" r="28" fill="#1BC736" fill-opacity="0.4"/>
    <line x1="235" y1="210" x2="355" y2="210" stroke="#263328" stroke-width="2"/>
    <line x1="235" y1="225" x2="340" y2="225" stroke="#263328" stroke-width="2"/>
  </g>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    Jornais do Dia Logo nas Primeiras Horas da Manhã
  </text>
  <text x="400" y="415" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#1BC736" text-anchor="middle">
    Folha, Estadão, O Globo, Valor Econômico e Noticiários Regionais
  </text>
</svg>
